---
name: Python UV Tests

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the test job.
        required: false
        type: string
        default: ubuntu-latest
      python-version:
        description: Python version passed to actions/setup-python.
        required: false
        type: string
        default: "3.13"
      uv-version:
        description: Optional uv version; an empty value uses setup-uv's default.
        required: false
        type: string
        default: ""
      test-results-path:
        description: Optional path to test reports to upload, relative to the workspace.
        required: false
        type: string
        default: ""
      test-results-name:
        description: Unique artifact name when test-results-path is set.
        required: false
        type: string
        default: python-test-results
      working-directory:
        description: Directory containing the Python project.
        required: false
        type: string
        default: .
      sync-command:
        description: Dependency sync command.
        required: false
        type: string
        default: uv sync --extra dev
      lint-command:
        description: Optional lint command. Leave empty to skip.
        required: false
        type: string
        default: ""
      test-command:
        description: Test command.
        required: false
        type: string
        default: uv run pytest

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Setup UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: ${{ inputs.uv-version }}

      - name: Sync dependencies
        run: ${{ inputs.sync-command }}

      - name: Lint
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}

      - name: Test
        run: ${{ inputs.test-command }}

      - name: Upload test results
        if: always() && inputs.test-results-path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.test-results-name }}
          path: ${{ inputs.test-results-path }}
          if-no-files-found: error
          retention-days: 14
