name: Native multi-platform Docker image

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      file:
        type: string
        required: true
      context:
        type: string
        default: .
      labels:
        type: string
        default: ''
      cache-scope:
        type: string
        required: true
    secrets:
      github-token:
        required: true
    outputs:
      digest:
        value: ${{ jobs.index.outputs.digest }}
      tags:
        value: ${{ jobs.index.outputs.tags }}

permissions:
  contents: read
  packages: write

jobs:
  amd64:
    uses: ./.github/workflows/docker-build-push.yml
    with:
      runs-on: ubuntu-24.04
      image: ${{ inputs.image }}
      file: ${{ inputs.file }}
      context: ${{ inputs.context }}
      platforms: linux/amd64
      cache-scope: ${{ inputs.cache-scope }}-amd64
      flavor: latest=false
      tags: type=raw,value=sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-amd64
      labels: ${{ inputs.labels }}
    secrets:
      github-token: ${{ secrets.github-token }}

  arm64:
    uses: ./.github/workflows/docker-build-push.yml
    with:
      runs-on: ubuntu-24.04-arm
      image: ${{ inputs.image }}
      file: ${{ inputs.file }}
      context: ${{ inputs.context }}
      platforms: linux/arm64
      cache-scope: ${{ inputs.cache-scope }}-arm64
      flavor: latest=false
      tags: type=raw,value=sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-arm64
      labels: ${{ inputs.labels }}
    secrets:
      github-token: ${{ secrets.github-token }}

  index:
    needs: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.index.outputs.digest }}
      tags: ${{ steps.index.outputs.tags }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}
      - name: Assemble and verify immutable OCI index
        id: index
        env:
          IMAGE: ${{ inputs.image }}
          AMD64: ${{ needs.amd64.outputs.digest }}
          ARM64: ${{ needs.arm64.outputs.digest }}
        run: |
          [[ "$AMD64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ARM64" =~ ^sha256:[0-9a-f]{64}$ ]]
          # Compute here, not in a prior job: partial reruns get a fresh identity.
          target="${IMAGE}:sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --tag "$target" "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          docker buildx imagetools inspect "$target" --raw | jq -e '
            [.manifests[] |
              select(.annotations["vnd.docker.reference.type"] != "attestation-manifest") |
              (.platform.os + "/" + .platform.architecture)] | sort == ["linux/amd64", "linux/arm64"]'
          digest=$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "tags=$target" >> "$GITHUB_OUTPUT"
