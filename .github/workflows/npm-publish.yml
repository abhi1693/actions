name: Publish prepared npm package
on:
  workflow_call:
    inputs:
      package-name:
        description: Exact expected package name.
        required: true
        type: string
      tag:
        description: Published stable release tag to verify and publish.
        required: true
        type: string
      preparation-workflow:
        description: Preparation caller filename in the immutable release tag.
        type: string
        default: release.yml
      working-directory:
        type: string
        default: .
      default-branch:
        type: string
        default: master
permissions:
  contents: read
concurrency:
  group: npm-publish-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACKAGE_NAME: ${{ inputs.package-name }}
      RELEASE_TAG: ${{ inputs.tag }}
      DEFAULT_BRANCH: ${{ inputs.default-branch }}
      PREPARATION_WORKFLOW: ${{ inputs.preparation-workflow }}
    steps:
      - name: Checkout released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Load release tools at workflow revision
        id: tools
        uses: $/.github/actions/npm-release
      - name: Verify release source and exact assets
        id: source
        env:
          TOOLS: ${{ steps.tools.outputs.path }}
        run: |
          RELEASE_SOURCE_SHA=$(git rev-parse HEAD)
          export RELEASE_SOURCE_SHA
          node "$TOOLS/release.mjs" source
          echo "source-sha=$RELEASE_SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Download and verify prepared release
        env:
          PREPARATION_REF: ${{ steps.source.outputs.preparation-ref }}
          RELEASE_SOURCE_SHA: ${{ steps.source.outputs.source-sha }}
          TOOLS: ${{ steps.tools.outputs.path }}
          ARCHIVE: ${{ steps.source.outputs.archive }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm-publish"
          gh release download "$RELEASE_TAG" --pattern "$ARCHIVE" --pattern SHA256SUMS --pattern provenance.json --dir "$RUNNER_TEMP/npm-publish"
          node "$TOOLS/provenance.mjs" "$RUNNER_TEMP/npm-publish/$ARCHIVE" \
            "$RUNNER_TEMP/npm-publish/provenance.json"
      - name: Publish using npm trusted publishing and verify registry bytes
        env:
          ARCHIVE: ${{ steps.source.outputs.archive }}
          TOOLS: ${{ steps.tools.outputs.path }}
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          node "$TOOLS/publish.mjs" "$RUNNER_TEMP/npm-publish/$ARCHIVE"
